[project]
name = "pymedia"
version = "0.1.1"
description = "Aplicación de consola, CLI + TUI, que actúa como handler de comandos ffmpeg."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Isidro Rodríguez", email = "rodriguez.gon.isidro@gmail.com" },
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "platformdirs>=4.11.0",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "nuitka>=4.1.3",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]

[project.scripts]
pymedia = "pymedia.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Configuración de Ruff (Linter + Formatter)
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# Errores básicos, Pyflakes, imports ordenados, pyupgrade y bugbear
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Configuración de Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
