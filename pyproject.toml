[project]
name = "pymedia"
dynamic = ["version"]
description = "Aplicación de consola que actúa como handler de comandos ffmpeg."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Isidro Rodríguez", email = "rodriguez.gon.isidro@gmail.com" },
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "platformdirs==4.11.12",
    "rich>=15.0.0",
    "typer==0.27.2",
]

[dependency-groups]
dev = [
    "babel>=2.16.0",
    "pdoc>=16.0.0",
    "pre-commit>=4.0.0",
    "pyinstaller>=6.22.3",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.3.0",
    "ty>=0.0.84",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
pymedia = "pymedia.main:app"

[tool.hatch.version]
path = "src/pymedia/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pymedia"]

# Los catálogos gettext (.po/.pot/.mo) no son paquetes Python: forzar inclusión.
[tool.hatch.build.targets.wheel.force-include]
"src/pymedia/locales" = "pymedia/locales"

# Configuración de Ruff (Linter + Formatter)
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# Errores básicos, Pyflakes, imports ordenados, pyupgrade, bugbear y docstrings
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
[tool.ruff.lint.pydocstyle]
convention = "google"

# .local: documentos internos
[tool.ruff.lint.per-file-ignores]
".local/**" = ["D", "E501"]

# Configuración de Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Registra la marca para evitar advertencias en consola
markers = [
    "locales: tests de comprobación de traducciones",
    "binary: tests contra el ejecutable compilado con PyInstaller (build lento)",
]

# Excluye la marca 'binary' por defecto en cualquier ejecución
addopts = "-m 'not binary and not locales'"

[tool.coverage.report]
exclude_also = ["raise MissingParameterError", "raise InvalidParameterError"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.rules]
possibly-unresolved-reference = "error"