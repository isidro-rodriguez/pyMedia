[project]
name = "pymedia"
dynamic = ["version"]
description = "Aplicación de consola que actúa como handler de comandos ffmpeg."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Isidro Rodríguez", email = "rodriguez.gon.isidro@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["platformdirs==4.13.5", "rich>=15.0.0", "typer==0.27.3"]

[dependency-groups]
dev = [
    "babel>=2.16.0",
    "pdoc>=16.0.0",
    "pre-commit>=4.0.0",
    "pyinstaller>=6.22.3",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.3.0",
    "ty>=0.0.84",
    "zensical>=0.0.71",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
pymedia = "pymedia.main:run"

[tool.hatch.version]
path = "src/pymedia/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pymedia"]

# --- Poe the Poet (opcional) -------------------------------------------------
# Atajos para quien tenga `poe` instalado globalmente (`uv tool install poethepoet`).
# No es dependencia del proyecto: todo se puede ejecutar también con `uv run`.
[tool.poe]
executor.type = "uv"

[tool.poe.tasks.check]
help = "Formato, lint, tipos y tests"
sequence = ["ruff format --check .", "ruff check .", "ty check", "pytest"]
default_item_type = "cmd"

[tool.poe.tasks.fix]
help = "Aplica el formato y las correcciones automáticas de Ruff"
sequence = ["ruff format .", "ruff check --fix ."]
default_item_type = "cmd"

[tool.poe.tasks.ci]
help = "Reproduce el job de calidad del CI (sin binary)"
sequence = [
    "ruff format --check .",
    "ruff check .",
    "ty check",
    "pytest --cov=pymedia --cov-report=term-missing:skip-covered --cov-fail-under=95",
    "pytest -m locales",
]
default_item_type = "cmd"

[tool.poe.tasks.i18n]
help = "Extrae, actualiza, compila y valida los catálogos de traducción"
sequence = [
    "python scripts/i18n.py extract",
    "python scripts/i18n.py update -l spanish",
    "python scripts/i18n.py compile -l spanish",
    "python scripts/i18n.py check",
    "pytest -m locales",
]
default_item_type = "cmd"

[tool.poe.tasks.fixtures]
help = "Genera los fixtures manuales en tests/fixtures"
cmd = "python scripts/generate_fixtures.py"

[tool.poe.tasks.build]
help = "Compila el ejecutable con PyInstaller y lo empaqueta"
sequence = ["python scripts/build.py", "python scripts/package.py"]
default_item_type = "cmd"

[tool.poe.tasks.serve]
help = "Previsualiza la documentación en http://localhost:8000"
cmd = "zensical serve"

[tool.poe.tasks.backup]
help = "Copia de seguridad del repositorio con git bundle"
cmd = "python scripts/backup.py"

# Configuración de Ruff (Linter + Formatter)
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# Errores básicos, Pyflakes, imports ordenados, pyupgrade, bugbear y docstrings
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
[tool.ruff.lint.pydocstyle]
convention = "google"

# Configuración de Pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Registra la marca para evitar advertencias en consola
markers = [
    "locales: tests de comprobación de traducciones",
    "binary: tests contra el ejecutable compilado con PyInstaller (build lento)",
]

# Excluye la marca 'binary' por defecto en cualquier ejecución
addopts = "-m 'not binary and not locales'"

[tool.coverage.report]
exclude_also = ["raise MissingParameterError", "raise InvalidParameterError"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.rules]
possibly-unresolved-reference = "error"
