# Hooks de git para pyMedia.
# Instalación (pre-commit y pre-push): uv run pre-commit install
# Ejecución manual:
#   uv run pre-commit run --all-files                         # hooks de pre-commit
#   uv run pre-commit run --all-files --hook-stage pre-push   # hooks de pre-push
default_install_hook_types: [pre-commit, pre-push]

repos:
  # ── pre-commit: rápido, en cada commit ──────────────────────────────────
  - repo: local
    hooks:
      - id: ruff-check-fix
        name: Ruff check --fix (autocorrección)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-check
        name: Ruff check (lint)
        entry: uv run ruff check
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ty-check
        name: Ty
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: pytest
        name: Pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

  # ── pre-push: suite completa antes de publicar ──────────────────────────
  - repo: local
    hooks:
      # El CI instala con `uv sync --locked`: falla si uv.lock no está al día.
      - id: uv-lock-check
        name: uv.lock al día con pyproject.toml
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pytest-cov
        name: Pytest con cobertura (mínimo 95 %)
        entry: uv run pytest -q --cov=pymedia --cov-report=term-missing:skip-covered --cov-fail-under=95
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pytest-locales
        name: Pytest -m locales
        entry: uv run pytest -q -m locales
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
