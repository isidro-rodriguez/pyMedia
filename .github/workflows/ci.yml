name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.13"]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sincronizar dependencias
        run: uv sync --group dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Verificar formato (ruff format --check)
        run: uv run ruff format . --check

      - name: Tipado estático (mypy)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest -v
