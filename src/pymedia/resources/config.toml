# | AV1     |  ✓  |  ✓  |  ✓   |     |     |         |
# | H.264   |  ✓  |  ✓  |      |     |     |         |
# | H.265   |  ✓  |  ✓  |      |     |     |         |
# | AAC     |  ✓  |  ✓  |      |  ✓  |     |         |
# | E-AC-3  |  ✓  |  ✓  |      |     |     |         |
# | Opus    |  ✓  |     |  ✓   |     |  ✓  |         |
